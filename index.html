<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowGPT</title>
</head>
<body>
    <style>
        * {
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 5mm;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: #0f0f0f;

            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-direction: column;
            width: 70vw;
            height: 100vh;
        }

        #textbox {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #textbox input {
            background-color: #0f0f0f;
            border: 1px solid #2f2f2f;
            border-radius: 1rem;
            bottom: 0;
            width: 100%;
        }

        input {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem 1.2rem;
            border: 1px solid #374151;
            border-radius: 8px;
            
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            border-color: #4f4f4f;
            box-shadow: 0 0 0 0px #000;
        }

        #replies {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: scroll;
        }

        .meowgpt_msg {
            width: 100%;
            display: flex;
            justify-content: left;
        }

        .meowgpt_msg p {
            justify-self: left;
            background-color: #181718;
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            width: fit-content;
            max-width: 50%;
        }

        .user_msg {
            width: 100%;
            display: flex;
            justify-content: right;
        }
        
        .user_msg p {
            justify-self: right;
            background-color: #383538;
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            width: fit-content;
        }

        .disclamer {
            font-size: 4mm;
            text-align: center;
            color: #838282;
        }
    </style>

    <main>
        <div id="replies">

        </div>
        <div id="textbox">
            <input type="text" id="text1"/>
            <p class="disclamer">MeowGPT is perfect. It never makes mistakes.</p>
        </div>
    </main>

    <script>
        var answering = false;

        var user_textbox = document.getElementById('text1');
        user_textbox.onkeypress = keyPresser;

        var msg_container = document.getElementById('replies');

        function keyPresser(e) {
            var e = e || window.event;
            var originalElement = e.srcElement || e.originalTarget;

            if (e.keyCode === 13) {
                sendMessage(user_textbox.value);
            }
        }

        function isEmptyOrSpaces(str){
            return str === null || str.match(/^ *$/) !== null;
        }

        function sendMessage(content) {
            if (answering || isEmptyOrSpaces(content)) return;

            user_textbox.value = '';

            const msg = document.createElement("div");
            msg.classList.add('user_msg');
            msg.innerHTML = '<p>' + content + '</p>';
            msg_container.appendChild(msg);

            generate_answer();
        }

        function getRndInteger(min, max) {
            return Math.floor(Math.random() * (max - min) ) + min;
        }

        var meows = [
            'meow', 'purr', 'mrrow', 'mraoww', 'miao', 'nya', 'miau', 'miaou', 'prrrr', 'mrrowww', 'mraowwww', 'meoww', 'mew', 'mrppp'
        ];

        function sleep(time) {
            return new Promise((resolve) => setTimeout(resolve, time));
        }

        async function pick_word() {
            var delay = getRndInteger(10, 100);
            await sleep(delay);
            var idx = Math.floor(Math.random() * meows.length);
            return meows[idx];
        }

        function capitalizeFirstLetter(val) {
            return String(val).charAt(0).toUpperCase() + String(val).slice(1);
        }

        async function generate_answer() {
            user_textbox.value = '';
            answering = true;

            const msg = document.createElement("div");
            msg.classList.add('meowgpt_msg');
            msg_container.appendChild(msg);
            const reply = document.createElement("p");
            msg.appendChild(reply);

            var paragraphs = getRndInteger(2, 5);

            for (var p = 0; p < paragraphs; p++) {
                var c = getRndInteger(3, 50);
                
                for (var i = 0; i < c; i++) {
                    var word = await pick_word();
                    if (i == 0) word = capitalizeFirstLetter(word);

                    if (i+1 == c) { word += '.'; } 
                    else          { word += ' '; } 
                    
                    reply.innerHTML +=  word;
                    reply.scrollIntoView();
                }
                
                if (p+1 != paragraphs)
                    reply.innerHTML +='<br><br>';

            }
            
            answering = false;
        }
    </script>
</body>
</html>
